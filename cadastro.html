<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Zone - Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(180deg, #53575f 0%, #2d3748 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 520px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: #252525;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            padding: 36px 28px;
            background: #333a45;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 2.3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            color: #cbd5e0;
            font-size: 1em;
        }

        .content {
            padding: 34px 28px;
        }

        .message {
            display: none;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background: #38a169;
            color: #ffffff;
        }

        .message.error {
            background: #e53e3e;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-size: 0.95em;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1a1a1a;
            color: #ffffff;
            font: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #38a169;
            box-shadow: 0 0 0 3px rgba(56, 161, 105, 0.2);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 4px 0 22px;
            color: #cbd5e0;
            font-size: 0.92em;
            line-height: 1.4;
        }

        .terms input {
            margin-top: 3px;
            accent-color: #38a169;
        }

        .button-submit,
        .back-button {
            width: 100%;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }

        .button-submit {
            padding: 17px;
            background: #38a169;
            font-size: 1.1em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .button-submit:hover {
            background: #2f855a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .login-text {
            margin-top: 20px;
            color: #cbd5e0;
            text-align: center;
            font-size: 0.95em;
        }

        .login-text a {
            color: #48bb78;
            font-weight: 700;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .divider {
            height: 1px;
            margin: 26px 0;
            background: #444;
        }

        .back-button {
            display: inline-block;
            padding: 12px 28px;
            width: auto;
            background: #4a5568;
            font-size: 15px;
        }

        .back-button:hover {
            background: #2d3748;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .back-area {
            text-align: center;
        }

        @media (max-width: 600px) {
            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 26px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="header">
            <h1>&#127918; Cadastro</h1>
            <p>Crie sua conta na Play Zone</p>
        </section>

        <section class="content">
            <div id="successMessage" class="message success">
                &#10003; Cadastro realizado com sucesso!
            </div>

            <div id="errorMessage" class="message error">
                &#10007; Preencha todos os campos corretamente.
            </div>

            <form id="cadastroForm">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" minlength="6" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" minlength="6" autocomplete="new-password" required>
                </div>

                <label class="terms" for="termos">
                    <input type="checkbox" id="termos" name="termos" required>
                    <span>Li e aceito os termos de uso da Play Zone.</span>
                </label>

                <button class="button-submit" type="submit">Cadastrar</button>
            </form>

            <p class="login-text">
                J&aacute; tem uma conta? <a href="loguin.html">Entrar</a>
            </p>

            <div class="divider"></div>

            <div class="back-area">
                <button class="back-button" type="button" onclick="window.location.href='index.html'">Voltar para a loja</button>
            </div>
        </section>
    </main>

    <script>
        var cadastroForm = document.getElementById('cadastroForm');
        var successMessage = document.getElementById('successMessage');
        var errorMessage = document.getElementById('errorMessage');

        function mostrarMensagem(tipo, texto) {
            var mensagemAtual = tipo === 'success' ? successMessage : errorMessage;
            var outraMensagem = tipo === 'success' ? errorMessage : successMessage;

            mensagemAtual.textContent = texto;
            mensagemAtual.style.display = 'block';
            outraMensagem.style.display = 'none';

            setTimeout(function() {
                mensagemAtual.style.display = 'none';
            }, 5000);
        }

        cadastroForm.addEventListener('submit', function(evento) {
            evento.preventDefault();

            var nome = document.getElementById('nome').value.trim();
            var email = document.getElementById('email').value.trim();
            var telefone = document.getElementById('telefone').value.trim();
            var senha = document.getElementById('senha').value;
            var confirmarSenha = document.getElementById('confirmarSenha').value;
            var termos = document.getElementById('termos').checked;

            if (!nome || !email || !senha || !confirmarSenha || !termos) {
                mostrarMensagem('error', 'Preencha todos os campos obrigat\u00f3rios.');
                return;
            }

            if (senha.length < 6) {
                mostrarMensagem('error', 'A senha precisa ter pelo menos 6 caracteres.');
                return;
            }

            if (senha !== confirmarSenha) {
                mostrarMensagem('error', 'As senhas n\u00e3o conferem.');
                return;
            }

            var usuario = {
                nome: nome,
                email: email,
                telefone: telefone
            };

            localStorage.setItem('playZoneUsuario', JSON.stringify(usuario));
            cadastroForm.reset();
            mostrarMensagem('success', 'Cadastro realizado com sucesso!');
        });
    </script>
</body>
</html>
