<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Zone - Login</title>
  <link rel="icon" type="image/jpeg" href="logo2.jpeg">
  <link rel="stylesheet" href="loguin.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-head">
        <img class="auth-logo" src="logo2.jpeg" alt="Play Zone">
        <div>
          <p class="auth-kicker">Play Zone</p>
          <h1>Login</h1>
        </div>
      </div>

      <p class="auth-text">Entre para continuar sua compra e acessar o carrinho.</p>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="email">E-mail</label>
          <div class="field-shell">
            <input placeholder="Digite seu e-mail" id="email" type="email" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <div class="field-shell">
            <input placeholder="Digite sua senha" id="password" type="password" autocomplete="current-password" required>
          </div>
        </div>

        <div class="auth-row">
          <label class="remember">
            <input type="checkbox">
            <span>Lembrar de mim</span>
          </label>
          <a class="auth-link" href="#">Esqueceu sua senha?</a>
        </div>

        <button class="button-submit" type="submit">Entrar</button>
        <p id="message" class="auth-message" aria-live="polite"></p>

        <div class="auth-minimal-row">
          <span>Não tem login?</span>
          <a class="mini-button" href="cadastro.html">Cadastro</a>
        </div>

        <button class="back-button" type="button" onclick="history.back()">Voltar</button>
      </form>
    </section>
  </main>

  <script src="loguin.js"></script>
</body>
</html>
