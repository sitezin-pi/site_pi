<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Zone - Contato</title>
  <link rel="icon" type="image/jpeg" href="logo2.jpeg">
  <link rel="stylesheet" href="contanto.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-head">
        <img class="auth-logo" src="logo2.jpeg" alt="Play Zone">
        <div>
          <p class="auth-kicker">Play Zone</p>
          <h1>Contato</h1>
        </div>
      </div>

      <p class="auth-text">Fale com a gente usando o formulário abaixo ou pelos canais de atendimento.</p>

      <div id="successMessage" class="message success">
        &#10003; Mensagem enviada com sucesso!
      </div>

      <div id="errorMessage" class="message error">
        &#10007; Erro ao enviar mensagem. Tente novamente.
      </div>

      <form id="formulario" class="auth-form">
        <div class="field">
          <label for="nome">Nome completo</label>
          <div class="field-shell">
            <input type="text" id="nome" name="nome" autocomplete="name" required>
          </div>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <div class="field-shell">
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label for="telefone">Telefone</label>
          <div class="field-shell">
            <input type="tel" id="telefone" name="telefone" autocomplete="tel">
          </div>
        </div>

        <div class="field">
          <label for="assunto">Assunto</label>
          <div class="field-shell">
            <input type="text" id="assunto" name="assunto" required>
          </div>
        </div>

        <div class="field">
          <label for="mensagem">Mensagem</label>
          <div class="field-shell field-shell-textarea">
            <textarea id="mensagem" name="mensagem" required></textarea>
          </div>
        </div>

        <button class="button-submit" type="submit">Enviar mensagem</button>

        <div class="contact-box">
          <div class="contact-item">
            <span class="contact-icon">&#9993;&#65039;</span>
            <div>
              <strong>E-mail:</strong><br>
              <a href="mailto:playzone@gmail.com">playzone@gmail.com</a>
            </div>
          </div>

          <div class="contact-item">
            <span class="contact-icon">&#128241;</span>
            <div>
              <strong>WhatsApp:</strong><br>
              <a href="https://wa.me/5511999999999" target="_blank" rel="noopener">Clique aqui para conversar</a>
            </div>
          </div>

          <div class="contact-item">
            <span class="contact-icon">&#9200;</span>
            <div>
              <strong>Horário de atendimento:</strong><br>
              Segunda a Sexta: 9h às 18h
            </div>
          </div>
        </div>

        <button class="back-button" type="button" onclick="window.location.href='index.html'">Voltar para a loja</button>
      </form>
    </section>
  </main>

  <script>
    var formulario = document.getElementById('formulario');
    var successMessage = document.getElementById('successMessage');
    var errorMessage = document.getElementById('errorMessage');

    formulario.addEventListener('submit', function(evento) {
      evento.preventDefault();

      var nome = document.getElementById('nome').value.trim();
      var email = document.getElementById('email').value.trim();
      var telefone = document.getElementById('telefone').value.trim();
      var assunto = document.getElementById('assunto').value.trim();
      var mensagem = document.getElementById('mensagem').value.trim();

      if (nome && email && assunto && mensagem) {
        successMessage.style.display = 'block';
        errorMessage.style.display = 'none';

        var corpoEmail = 'Nome: ' + nome +
          '\nE-mail: ' + email +
          '\nTelefone: ' + telefone +
          '\n\nMensagem:\n' + mensagem;

        var linkEmail = 'mailto:playzone@gmail.com?subject=' +
          encodeURIComponent(assunto) +
          '&body=' +
          encodeURIComponent(corpoEmail);

        formulario.reset();
        window.location.href = linkEmail;

        setTimeout(function() {
          successMessage.style.display = 'none';
        }, 5000);
      } else {
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';

        setTimeout(function() {
          errorMessage.style.display = 'none';
        }, 5000);
      }
    });
  </script>
</body>
</html>
