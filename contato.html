<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contanto.css">
    <title>Play Zone - Contato</title>
    <link rel="icon" type="image/jpeg" href="logo2.jpeg">
   
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>&#127918; Play Zone</h1>
            <p>Entre em contato conosco</p>
        </div>

        <div class="content">
            <div id="successMessage" class="success-message">
                &#10003; Mensagem enviada com sucesso!
            </div>

            <div id="errorMessage" class="error-message">
                &#10007; Erro ao enviar mensagem. Tente novamente.
            </div>

            <form id="formulario">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone">
                </div>

                <div class="form-group">
                    <label for="assunto">Assunto</label>
                    <input type="text" id="assunto" name="assunto" required>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" required></textarea>
                </div>

                <button type="submit">Enviar Mensagem</button>
            </form>

            <div class="info-section">
                <h3>Informa&ccedil;&otilde;es de Contato</h3>

                <div class="info-item">
                    <div class="info-icon">&#9993;&#65039;</div>
                    <div>
                        <strong>E-mail:</strong><br>
                        <a href="mailto:playzone@gmail.com">playzone@gmail.com</a>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">&#128241;</div>
                    <div>
                        <strong>WhatsApp:</strong><br>
                        <a href="https://wa.me/5511999999999" target="_blank" rel="noopener">Clique aqui para conversar</a>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">&#9200;</div>
                    <div>
                        <strong>Hor&aacute;rio de Atendimento:</strong><br>
                        Segunda a Sexta: 9h &agrave;s 18h
                    </div>
                </div>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button class="back-button" type="button" onclick="window.location.href='index.html'">Voltar</button>
            </div>
        </div>
    </div>

    <script>
        var formulario = document.getElementById('formulario');
        var successMessage = document.getElementById('successMessage');
        var errorMessage = document.getElementById('errorMessage');

        formulario.addEventListener('submit', function(evento) {
            evento.preventDefault();

            var nome = document.getElementById('nome').value.trim();
            var email = document.getElementById('email').value.trim();
            var telefone = document.getElementById('telefone').value.trim();
            var assunto = document.getElementById('assunto').value.trim();
            var mensagem = document.getElementById('mensagem').value.trim();

            if (nome && email && assunto && mensagem) {
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';

                var corpoEmail = 'Nome: ' + nome +
                    '\nE-mail: ' + email +
                    '\nTelefone: ' + telefone +
                    '\n\nMensagem:\n' + mensagem;

                var linkEmail = 'mailto:playzone@gmail.com?subject=' +
                    encodeURIComponent(assunto) +
                    '&body=' +
                    encodeURIComponent(corpoEmail);

                formulario.reset();
                window.location.href = linkEmail;

                setTimeout(function() {
                    successMessage.style.display = 'none';
                }, 5000);
            } else {
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';

                setTimeout(function() {
                    errorMessage.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
