<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre o seu endereço - Play Zone</title>
    <link rel="stylesheet" href="endereço.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="card">
    <!-- Ícone de Seta (Topo) -->
    <div class="icon-header">
      <img class="logo2" src="logo2.jpeg" alt="Logo GameStore">

            <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
        </svg>
    </div>

    <span class="brand-tag">PLAY ZONE</span>
    <h1>Cadastre o seu endereço</h1>

    <form id="addressForm">
        <input type="text" id="cep" placeholder="CEP" maxlength="9" required>
        <input type="text" id="rua" placeholder="Rua" required>
        
        <div class="row">
            <input type="text" id="numero" placeholder="Número" required>
            <input type="text" id="complemento" placeholder="Complemento">
        </div>

        <input type="text" id="bairro" placeholder="Bairro" required>

        <div class="row">
            <input type="text" id="cidade" placeholder="Cidade" required>
            <input type="text" id="estado" placeholder="Estado" required>
        </div>

        <button type="submit" class="btn-continue">Continuar</button>
    </form>
</div>

<script src="endereço.js"></script>
</body>
</html>
